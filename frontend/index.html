<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wind-turbine.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>风调预顺 - PHM预测性运维系统</title>
    <!--
      离线可运行是本系统的硬要求（评审可能在无外网环境复现），因此不引入任何外部 CDN：
      · 字体：使用系统内置中文字体栈（见 global.css 的 --font-sans），
        原先的 Google Fonts 链接在离线时会产生数百条 CORS/网络错误且字体照样回退；
      · Leaflet 样式：已在 src/main.tsx 中通过 `import 'leaflet/dist/leaflet.css'` 本地打包，
        原先额外挂的 unpkg 链接既重复又会在断网时导致地图布局错乱。
    -->
  </head>
  <body class="bg-gray-950 text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
